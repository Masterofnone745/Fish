<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Game Mockup</title>
    <link rel="stylesheet" href="fishingGame.css">
    <link rel="icon" href="Fish.png" type="image/png">
</head>
<body>

<div id="gameContainer" class="state-menu">
    
    <div id="mainMenu" class="menu-overlay">
    <div class="menu-box" id="startMenuBox">
        <h1 class="menu-title">FISHING GAME</h1>
        <button id="startBtn" class="menu-button"> NEW GAME</button>
        <button id="continueBtn" class="menu-button"> CONTINUE </button>
    </div>

    <div class="menu-box" id="gameOverBox" style="display: none;">
        <h1 class="menu-title">TIME'S UP!</h1>
        <p class="menu-text" style="color: #fff; font-size: 20px; margin-bottom: 10px;">
            You caught: <span id="finalScore" style="color: #4ade80; font-weight: bold;">0</span> fish
        </p>
        <p class="menu-text" style="color: #94a3b8; font-size: 18px; margin-bottom: 30px;">
            High score: <span id="highScoreDisplay" style="color: #f59e0b; font-weight: bold;">0</span>
        </p>
        <button id="backToMapBtn" class="menu-button">BACK TO MAP</button>
    </div>
</div>

<div id="inventoryMenu" class="menu-overlay" style="display: none;">
    <div class="inventory-container">
        <div class="inventory-header">
            <button id="invBackToMapBtn" class="menu-button-alt">Back to map</button>
        </div>

        <div id="inventoryGrid" class="inventory-grid">
            </div>

        <div class="inventory-footer">
            <span id="invPageIndicator" class="page-number">1/1</span>
            <button id="invNextPageBtn" class="next-arrow-btn">➔</button>
        </div>
    </div>
</div>

    <div id="mapMenu" class="screen">
        <div class="lake-map">
            <button class="map-node point-a" data-location="1">Point A</button>
            <button class="map-node point-b1" data-location="2">Point B</button>
            <button class="map-node point-b2" data-location="3">Point C</button>
            
            <button class="map-util shop-btn">Shop</button>
            <button id="inventoryBtn" class="map-util inventory-btn">Fish inventory</button>
        </div>
    </div>

    <div id="shopMenu" class="screen" style="display: none;">
    <div class="shop-container">
        
        <div class="shop-header-row">
            <div class="shop-header-box">BUY</div>
            <button id="sellFishBtn" class="shop-header-box interactive-box">SELL fish</button>
        </div>

        <div class="shop-main-content">
           <button id="buyBaitBtn" style="color: black;">Buy Bait</button>
           <button id="upgradeInvBtn" style="color: black;">Upgrade Inventory</button>
        </div>

        <div class="shop-footer-row">
            <button id="shopBackToMapBtn" class="shop-text-btn">Back to map</button>
            <div id="moneyDisplay" class="shop-text-label">Money: 0</div>
        </div>

    </div>
</div>

    <div id="gameplayScreen" class="screen">
        <div class="ui-overlay">
            <div class="score-display">Fish Caught: <span id="score">0</span></div>
        </div>

        <div id="timerDisplay" class="game-timer">Time: 60</div>
        <div class="ground"></div>

        <div class="water" id="waterArea">
            <div class="fishing-line" id="fishingLine">
                <div class="hook"></div>
            </div>
        </div>

        <svg class="trajectory-svg" id="trajectorySvg">
            <path id="aimArc" d="" fill="none" stroke="rgba(255, 255, 255, 0.8)" stroke-width="3" stroke-dasharray="6,4" />
            <circle id="aimTarget" cx="0" cy="0" r="25" fill="rgba(255, 255, 255, 0.15)" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,3" />
        </svg>

        <div class="player">
            player
            <div class="rod-pivot">
                <div class="rod" id="rod"></div>
            </div>
        </div>
    </div>

</div>

<script src="fishingGame.js"></script>
</body>
</html>
